<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>Offline - UHMS</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #0a1b39;
        }
        main {
            width: min(420px, calc(100% - 32px));
            padding: 24px;
            background: #ffffff;
            border: 1px solid #e7e8eb;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(10, 27, 57, 0.08);
        }
        h1 {
            margin: 0 0 8px;
            font-size: 22px;
        }
        p {
            margin: 0;
            line-height: 1.5;
            color: #545f74;
        }
    </style>
</head>
<body>
    <main>
        <h1>UHMS is offline</h1>
        <p>The network connection is unavailable. Reconnect and refresh to continue working in the system.</p>
    </main>
</body>
</html>
