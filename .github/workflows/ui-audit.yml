name: UI & Logging Audit

# UHMS governance guardrails.
#   UI audit   — staged gate (see docs/UI_PHASE_10_RELEASE_READINESS_REPORT.md):
#                Stage B (current): block only on NEW CRITICAL; rest advisory.
#                Stage C (later): --min-severity=HIGH · Stage D: --fail --strict.
#   Logs audit — advisory report + Stage-1 gate. The report always runs (artifact);
#                the gate blocks ONLY on CRITICAL real missing logs
#                (--only-real-gaps --min-severity=CRITICAL). It does NOT block on
#                covered / backlog / needs-review / HIGH findings. Promotion path in
#                docs/LOGGING_AUDIT_CI_GUARDRAIL_REPORT.md.

on:
  push:
    branches: [main, beta-x]
  pull_request:

jobs:
  ui-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, bcmath
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      # ── Advisory: always produce the full report (never fails the build) ──
      - name: UI audit (advisory report)
        run: php artisan ui:audit --json

      - name: Upload UI audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-report
          path: |
            storage/reports/ui-audit-report.md
            storage/reports/ui-audit-report.json
          if-no-files-found: warn

      # ── Advisory: logging-coverage report (NON-BLOCKING — never fails the build) ──
      # logs:audit returns 0 without --fail; `|| true` is a defensive belt-and-braces
      # so this step can never break CI even if the command behaviour changes.
      - name: Logging audit (advisory report)
        run: php artisan logs:audit --json || true

      - name: Upload logging audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-audit-report
          path: |
            storage/reports/logs-audit-report.json
            storage/app/logs-audit-baseline.json
          if-no-files-found: warn

      # ── Gate (Stage 1): fail ONLY on CRITICAL real missing logs ──
      # --only-real-gaps   → only MISSING_LOG classification counts (un-funnelled).
      # --min-severity     → only CRITICAL of those counts.
      # This blocks a brand-new un-funnelled CRITICAL action while NEVER failing on
      # SERVICE_FUNNEL_COVERED, KNOWN_BACKLOG, INTENTIONALLY_SKIPPED, NEEDS_REVIEW,
      # or HIGH/MEDIUM findings. Promotion path (see
      # docs/LOGGING_AUDIT_CI_GUARDRAIL_REPORT.md):
      #   Stage 1 (now): --only-real-gaps --min-severity=CRITICAL
      #   Stage 2:       --only-real-gaps --min-severity=HIGH   (after NEEDS_REVIEW cleared)
      #   Stage 3:       --strict                               (after backlog cleared)
      - name: Logging audit gate (Stage 1 — critical real gaps only)
        run: php artisan logs:audit --fail --only-real-gaps --min-severity=CRITICAL

      # ── Gate (Stage B): fail only on NEW CRITICAL findings outside the baseline ──
      # The committed baseline (storage/app/ui-audit-baseline.json) absorbs known debt,
      # so this blocks regressions without blocking on the existing HIGH/MEDIUM backlog.
      - name: UI audit gate (critical-only)
        run: php artisan ui:audit --fail --min-severity=CRITICAL
